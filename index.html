<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d3557">
<title>Inspeção Elétrica</title>
<style>
:root{--az:#1d3557;--bg:#eef1f5;--tx:#1a1f29;--ln:#cfd6e0;--no:#e0443e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--az);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center}
header b{font-size:18px}header small{opacity:.75;font-size:12px}#save{font-size:12px;opacity:.8}
main{max-width:640px;margin:0 auto;padding:12px}
label{display:block;font-size:13px;color:#5a6577;margin:10px 0 3px}
input[type=text],input[type=date]{width:100%;padding:11px;border:1px solid var(--ln);border-radius:8px;font:inherit;background:#fff}
details.item{border:1px solid var(--ln);border-radius:10px;background:#fff;margin-bottom:12px}
details.item summary{padding:14px;font-weight:600;color:var(--az);cursor:pointer}
.ib{padding:0 14px 14px}.ib h4{margin:18px 0 8px;color:var(--az);font-size:14px}
.seg{display:flex;gap:8px}
.btn{width:100%;padding:14px;border:0;border-radius:10px;background:var(--az);color:#fff;font:inherit;font-weight:600;margin-top:6px}
.btn.alt{background:#fff;color:var(--az);border:1px solid var(--az)}
.btn.red{background:#fff;color:var(--no);border:1px solid var(--no)}
.btn.add{background:#fff;color:var(--az);border:2px dashed var(--az)}
.ph{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.ph div{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.ph button{position:absolute;top:3px;right:3px;width:26px;height:26px;border:0;border-radius:50%;background:#000a;color:#fff}
.hint{font-size:12px;color:#7a8599}
/* relatório */
#report{display:none;background:#fff;color:#111;padding:12px;font-size:12px}
#report .top{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--az);padding-bottom:8px}
#report .top b{font-size:15px;color:var(--az)}
#report .it{margin-top:14px;padding-top:10px;border-top:2px solid var(--ln);break-inside:avoid}
#report h3{margin:0 0 6px;font-size:14px;color:var(--az)}
#report .info{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-bottom:8px}
#report .info span{color:#667;font-size:10px;display:block}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pg img{width:100%;height:190px;object-fit:cover;border-radius:4px;break-inside:avoid}
.bar{display:none;gap:8px;padding:12px;background:var(--bg);position:sticky;top:0;z-index:6}
body.rep main,body.rep header{display:none}body.rep #report{display:block}body.rep .bar{display:flex}
@media print{
 body{background:#fff}header,.bar,main{display:none!important}#report{display:block!important;padding:0}
 @page{size:A4;margin:12mm}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<header><div><b>Inspeção Elétrica</b><br><small>Relatório técnico</small></div><span id="save">salvo</span></header>
<div class="bar"><button class="btn alt" id="back" style="margin:0">Voltar</button><button class="btn" id="pdf" style="margin:0">Salvar PDF</button></div>
<main id="form"></main>
<div id="report"></div>

<script>
/* ======= EDITE AQUI: campos e nome da empresa ======= */
const EMPRESA = "Sua Empresa";            // aparece no topo do relatório
const HEAD = [
  ["eqp","Equipamento / Painel"],["rel","Nº do relatório"],["cli","Cliente / Fábrica"],
  ["loc","Local / Área"],["dat","Data","date"],["ins","Inspetor"],["art","ART"]
];
/* ==================================================== */
const $=s=>document.querySelector(s);
const newItem=(prev)=>({h:prev?{...prev.h,eqp:""}:{},p:[],o:true});
let S={items:[newItem()]},tgt=0;
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* armazenamento (IndexedDB) */
const db=new Promise(r=>{const q=indexedDB.open("insp",1);q.onupgradeneeded=()=>q.result.createObjectStore("s");q.onsuccess=()=>r(q.result)});
const dbGet=async()=>{const d=await db;return new Promise(r=>{const q=d.transaction("s").objectStore("s").get("d");q.onsuccess=()=>r(q.result);q.onerror=()=>r()})};
const dbPut=async v=>{const d=await db;d.transaction("s","readwrite").objectStore("s").put(v,"d")};
let t;const save=()=>{$("#save").textContent="salvando…";clearTimeout(t);t=setTimeout(async()=>{try{await dbPut(S);$("#save").textContent="salvo"}catch(e){$("#save").textContent="erro ao salvar"}},400)};
const keep=async()=>{await dbPut(S);const y=scrollY;render();scrollTo(0,y)};
const title=(m,i)=>esc(m.h.eqp)||"Registro "+(i+1);

function itemHTML(m,it){return `<details class="item" data-d="${it}" ${m.o?"open":""}><summary>${title(m,it)}</summary><div class="ib">
 ${HEAD.map(([k,n,ty])=>`<label>${n}</label><input type="${ty||"text"}" data-it="${it}" data-h="${k}" value="${esc(m.h[k])}">`).join("")}
 <h4>Fotos</h4>
 <div class="seg"><button class="btn" style="margin:0" data-ip="${it}">Tirar foto</button><button class="btn alt" style="margin:0" data-ig="${it}">Da galeria</button></div>
 <div class="ph">${m.p.map((s,i)=>`<div><img src="${s}"><button data-it="${it}" data-delp="${i}">×</button></div>`).join("")}</div>
 <p class="hint">${m.p.length} foto(s). Elas são reduzidas para o PDF não ficar pesado.</p>
 ${S.items.length>1?`<button class="btn red" style="margin-top:12px" data-rm="${it}">Remover este registro</button>`:""}</div></details>`}

function render(){
 $("#form").innerHTML=`
 <input type="file" id="icam" accept="image/*" capture="environment" hidden><input type="file" id="igal" accept="image/*" multiple hidden>
 ${S.items.map(itemHTML).join("")}
 <button class="btn add" id="add">+ Adicionar mais um registro</button>
 <button class="btn" id="gen" style="margin-top:10px">Gerar relatório</button>
 <button class="btn red" id="new" style="margin-top:10px">Novo relatório (limpar tudo)</button>`;
 $("#icam").onchange=e=>addP(e.target.files);$("#igal").onchange=e=>addP(e.target.files);
 $("#add").onclick=()=>{const last=S.items[S.items.length-1];S.items.forEach(m=>m.o=false);S.items.push(newItem(last));dbPut(S);render();
  const d=document.querySelector("details.item:last-of-type");d&&d.scrollIntoView()};
 $("#gen").onclick=showReport;
 $("#new").onclick=()=>{if(confirm("Apagar todos os dados e começar um novo relatório?")){S={items:[newItem()]};dbPut(S);render();scrollTo(0,0)}};
}

$("#form").addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;const d=b.dataset;
 if(d.ip!==undefined){tgt=+d.ip;$("#icam").value="";$("#icam").click()}
 if(d.ig!==undefined){tgt=+d.ig;$("#igal").value="";$("#igal").click()}
 if(d.delp!==undefined){S.items[d.it].p.splice(d.delp,1);keep()}
 if(d.rm!==undefined&&confirm("Remover este registro e suas fotos?")){S.items.splice(d.rm,1);keep()}
});
$("#form").addEventListener("input",e=>{const d=e.target.dataset;
 if(d.h){S.items[d.it].h[d.h]=e.target.value;
  if(d.h=="eqp")e.target.closest("details").querySelector("summary").textContent=title(S.items[d.it],+d.it);save()}});
$("#form").addEventListener("toggle",e=>{const d=e.target.dataset.d;if(d!==undefined&&S.items[d]){S.items[d].o=e.target.open;save()}},true);

function shrink(file,m=1100){return new Promise(res=>{
 const u=URL.createObjectURL(file),im=new Image();
 im.onload=()=>{const r=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");
  c.width=im.width*r;c.height=im.height*r;c.getContext("2d").drawImage(im,0,0,c.width,c.height);
  URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",.72))};
 im.src=u})}
async function addP(fl){const m=S.items[tgt];for(const f of fl)m.p.push(await shrink(f));keep()}

function showReport(){
 const fmt=(k,v)=>k=="dat"&&v?v.split("-").reverse().join("/"):esc(v)||"—";
 const first=S.items[0].h;
 $("#report").innerHTML=`
 <div class="top"><b>${esc(EMPRESA)}</b><b style="text-align:right">RELATÓRIO TÉCNICO DE INSPEÇÃO ELÉTRICA<br><small style="font-weight:400;color:#556">${esc(first.rel||"")}</small></b></div>
 ${S.items.map((m,i)=>`<div class="it"><h3>${title(m,i)}</h3>
  <div class="info">${HEAD.filter(([k])=>k!="eqp").map(([k,n])=>`<div><span>${n}</span>${fmt(k,m.h[k])}</div>`).join("")}</div>
  ${m.p.length?`<div class="pg">${m.p.map(s=>`<img src="${s}">`).join("")}</div>`:""}</div>`).join("")}`;
 document.body.classList.add("rep");scrollTo(0,0);
}
$("#back").onclick=()=>{document.body.classList.remove("rep");scrollTo(0,0)};
$("#pdf").onclick=()=>{
 const h=S.items[0].h,n=(h.rel||"relatorio")+(h.dat?"_"+h.dat:"");const old=document.title;
 document.title=n.replace(/[^\w-]+/g,"_");print();setTimeout(()=>document.title=old,1500)};

(async()=>{const d=await dbGet();
 if(d&&d.items&&d.items.length&&d.items[0].h)S=d;
 else if(d){ /* converte rascunho da versão anterior */
  const base=d.h||{},its=[];
  if(Object.keys(base).length||(d.p||[]).length)its.push({h:base,p:d.p||[],o:false});
  (d.items||[]).forEach(m=>its.push({h:{...base,eqp:m.n||""},p:m.p||[],o:false}));
  if(its.length)S={items:its}}
 render()})();
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
